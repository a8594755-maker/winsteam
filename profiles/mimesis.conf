# MIMESIS — Unity 6，DirectX 11
# 實測：M2 MacBook Air（16 GB、macOS 27.0.1）以 DXMT 可啟動並遊玩，麥克風有被偵測到。
# 其他來源：ProtonDB Gold。CodeWeavers 曾回報「Installs, Will Not Run」（CrossOver 26.0.0），與這裡的結果不同。
# 和 R.E.P.O. 用同一個後端，兩款之間切換不需要重新啟動 Steam。
NAME="MIMESIS"
APPID=2827200
BACKEND=dxmt
BACKEND_ALT=d3dmetal
MSYNC=1
TIPS="遊戲需要麥克風：第一次啟動時 macOS 會問麥克風權限，要按允許|比 R.E.P.O. 吃效能，卡頓時先把解析度降到 1280 × 800、畫質調低|在 Steam 對這款遊戲按右鍵 → 內容，關掉「遊戲中啟用 Steam 內嵌介面」|MacBook Air 沒有風扇，請插電遊玩；長時間會降頻"
